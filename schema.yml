components:
  schemas:
    AdminCartList:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        customer:
          type: integer
          nullable: true
        contact_name:
          type: string
          maxLength: 120
        contact_phone:
          type: string
          maxLength: 20
        contact_email:
          type: string
          format: email
          maxLength: 254
        status:
          $ref: '#/components/schemas/AdminCartListStatusEnum'
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        total_items:
          type: integer
          readOnly: true
        last_activity_at:
          type: string
          format: date-time
        abandoned_at:
          type: string
          format: date-time
          nullable: true
        recovered_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItem'
          readOnly: true
      required:
      - created_at
      - id
      - items
      - total_amount
      - total_items
      - updated_at
    AdminCartListStatusEnum:
      enum:
      - active
      - abandoned
      - contacted
      - recovered
      - converted
      - expired
      type: string
      description: |-
        * `active` - Active
        * `abandoned` - Abandoned
        * `contacted` - Contacted
        * `recovered` - Recovered
        * `converted` - Converted
        * `expired` - Expired
    AdminOrder:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        customer:
          type: integer
          nullable: true
        customer_details:
          allOf:
          - $ref: '#/components/schemas/Customer'
          readOnly: true
        order_number:
          type: string
          readOnly: true
          nullable: true
        customer_name:
          type: string
          maxLength: 100
        customer_email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        customer_phone:
          type: string
          nullable: true
          maxLength: 15
        city:
          type: string
          nullable: true
          maxLength: 255
        customer_address:
          type: string
          nullable: true
          maxLength: 255
        shipping_address:
          type: string
          nullable: true
          maxLength: 255
        delivery_charge:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        total_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        status:
          $ref: '#/components/schemas/StatusDeeEnum'
        transaction_id:
          type: string
          nullable: true
          maxLength: 255
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        is_paid:
          type: boolean
        is_manual:
          type: boolean
        attachment:
          type: string
          format: uri
          nullable: true
        additional_file:
          type: string
          format: uri
          nullable: true
        promo_code:
          type: integer
          nullable: true
        promo_code_details:
          type: object
          additionalProperties: {}
          nullable: true
          readOnly: true
        promo_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          readOnly: true
        offer:
          type: integer
          nullable: true
        offer_details:
          allOf:
          - $ref: '#/components/schemas/Offer'
          readOnly: true
        offer_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        note:
          type: string
          nullable: true
        pos_order:
          type: boolean
        latitude:
          type: number
          format: double
          nullable: true
        longitude:
          type: number
          format: double
          nullable: true
        payment_type:
          $ref: '#/components/schemas/PaymentTypeA30Enum'
        cash_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        online_amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          nullable: true
        online_payment_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/OnlinePaymentTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItem'
          writeOnly: true
        order_items:
          type: array
          items:
            $ref: '#/components/schemas/OrderItemDetail'
          readOnly: true
      required:
      - created_at
      - customer_details
      - customer_name
      - id
      - items
      - offer_details
      - order_items
      - order_number
      - promo_code_details
      - promo_discount
      - total_amount
      - updated_at
    Appointment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        full_name:
          type: string
          maxLength: 100
        phone:
          type: string
          maxLength: 15
        email:
          type: string
          format: email
          maxLength: 254
        message:
          type: string
          nullable: true
        reason_id:
          type: integer
          writeOnly: true
        reason:
          allOf:
          - $ref: '#/components/schemas/AppointmentReason'
          readOnly: true
        date:
          type: string
          format: date
          nullable: true
        time:
          type: string
          format: time
          nullable: true
        status:
          $ref: '#/components/schemas/AppointmentStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - email
      - full_name
      - id
      - phone
      - reason
      - updated_at
    AppointmentReason:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    AppointmentStatusEnum:
      enum:
      - pending
      - completed
      - cancelled
      type: string
      description: |-
        * `pending` - Pending
        * `completed` - Completed
        * `cancelled` - Cancelled
    Banner:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        banner_type:
          $ref: '#/components/schemas/BannerTypeEnum'
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        images:
